name: Monitor One Piece Card Game

on:
  # CRON DESACTIVADO: lo cubre monitor-continuo.yml, que recorre TODAS las tiendas
  # cada ~1-2 min. Ademas GitHub estrangula los schedule frecuentes: este '*/15'
  # disparaba de verdad cada ~4 h (medido 2-sep-2026: 01:01, 05:49, 10:45, 14:59,
  # 18:33 UTC). Se deja lanzable a mano para pruebas.
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          # Clave única por run al guardar + restauración por prefijo:
          # evita el error "cache already exists" y no necesita borrado manual.
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
